[project]
name = 'oct_segmentation'
version = '0.0.1'
description = 'OCT segmentation using deep learning'
readme = 'README.md'
requires-python = ">=3.12, <3.13"
dependencies = [
    "gigachat>=0.1.42.post2",
    "python-dotenv>=1.2.1",
]

[tool.uv]
package = true
default-groups = ["app", "dev"]

[dependency-groups]
app = [
    "dotenv>=0.9.9",
    "streamlit>=1.50.0",
]
dev = [
    "albumentations==1.4.3",
    "dvc==3.49.0",
    "dvc-gdrive==3.0.1",
    "grad-cam==1.5.0",
    "gradio>=5.48.0",
    "hydra-core>=1.3.2",
    "imagecodecs>=2025.8.2",
    "imutils>=0.5.4",
    "joblib>=1.5.2",
    "matplotlib>=3.10.7",
    "numpy==1.26.4",
    "omegaconf>=2.3.0",
    "opencv-python==4.8.1.78",
    "openpyxl>=3.1.5",
    "pandas==2.3.3",
    "pillow>=11.3.0",
    "plotly>=6.3.0",
    "pre-commit>=4.3.0",
    "ptflops>=0.7.5",
    "pydicom>=3.0.1",
    "pytorch-lightning==2.2.1",
    "scikit-image>=0.25.2",
    "seaborn>=0.13.2",
    "segmentation-models-pytorch>=0.5.0",
    "tifffile>=2025.9.30",
    "tomli>=2.3.0",
    "torch==2.2.2",
    "tqdm>=4.67.1",
    "wandb>=0.22.1",
]

[tool.setuptools.packages]
find = {}

[tool.pycln]
all = true

[tool.isort]
line_length = 100
multi_line_output = 3
force_grid_wrap = 0
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 'dynamic'
quote-style = 'double'
indent-style = 'space'
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ['D']
ignore = ['D100', 'D102', 'D103', 'D104', 'D105', 'D106', 'D107', 'D206', 'D300']
dummy-variable-rgx = '^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$'
exclude = [
    '.bzr',
    '.direnv',
    '.eggs',
    '.git',
    '.git-rewrite',
    '.hg',
    '.mypy_cache',
    '.nox',
    '.pants.d',
    '.pytype',
    '.ruff_cache',
    '.svn',
    '.tox',
    '.venv',
    'buck-out',
    'build',
    'dist',
    'node_modules',
    'venv',
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.mypy]
ignore_missing_imports = true
install_types = true
no_strict_optional = true
explicit_package_bases = true
exclude = [
    'src/models/smp/train.py',
]
