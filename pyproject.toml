[project]
name = 'oct_segmentation'
version = '0.0.1'
description = 'OCT segmentation using deep learning'
readme = 'README.md'
requires-python = ">=3.12, <3.13"
dependencies = []

[tool.uv]
package = true
default-groups = ["app", "dev"]

[dependency-groups]
app = [
    # Web app dependencies
]
dev = [
    "gradio>=5.48.0",
    "imagecodecs>=2025.8.2",
    "opencv-python>=4.12.0.88",
    "plotly>=6.3.0",
    "pre-commit>=4.3.0",
    "pydicom>=3.0.1",
    "scikit-image>=0.25.2",
    "segmentation-models-pytorch>=0.5.0",
    "tifffile>=2025.9.30",
    "wandb>=0.22.1",
]

[tool.setuptools.packages]
find = {}

[tool.pycln]
all = true

[tool.isort]
line_length = 100
multi_line_output = 3
force_grid_wrap = 0
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 'dynamic'
quote-style = 'double'
indent-style = 'space'
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ['D']
ignore = ['D100', 'D102', 'D103', 'D104', 'D105', 'D106', 'D107', 'D206', 'D300']
dummy-variable-rgx = '^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$'
exclude = [
    '.bzr',
    '.direnv',
    '.eggs',
    '.git',
    '.git-rewrite',
    '.hg',
    '.mypy_cache',
    '.nox',
    '.pants.d',
    '.pytype',
    '.ruff_cache',
    '.svn',
    '.tox',
    '.venv',
    'buck-out',
    'build',
    'dist',
    'node_modules',
    'venv',
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.mypy]
ignore_missing_imports = true
install_types = true
no_strict_optional = true
explicit_package_bases = true
